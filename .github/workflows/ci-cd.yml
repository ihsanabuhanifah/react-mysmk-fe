name: CI/CD Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: CI (lint & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Lint (gagal jika ada error / warning)
        run: npx eslint src --ext .js,.jsx --max-warnings=0

      # Hanya memastikan aplikasi bisa di-build. Build produksi yang sebenarnya
      # dibuat di server (docker compose) memakai .env milik server.
      - name: Cek build
        env:
          CI: false
        run: npm run build

  deploy:
    name: CD (docker compose lewat self-hosted runner)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # dijalankan oleh runner yang terpasang di VPS
    runs-on: self-hosted
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      # Atur di GitHub: Settings > Secrets and variables > Actions > Variables
      # folder clone repo frontend di server (berisi .env & docker-compose.yml)
      FE_APP_DIR: ${{ vars.FE_APP_DIR }}
    steps:
      - name: Pastikan FE_APP_DIR & .env ada
        run: |
          if [ -z "$FE_APP_DIR" ]; then
            echo "::error::Variable FE_APP_DIR belum diisi (folder repo frontend di server, mis. /home/student/react-mysmk-fe)"
            exit 1
          fi
          if [ ! -f "$FE_APP_DIR/.env" ]; then echo "::error::$FE_APP_DIR/.env tidak ditemukan"; exit 1; fi

      - name: Tarik kode terbaru
        working-directory: ${{ vars.FE_APP_DIR }}
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Build & jalankan container
        working-directory: ${{ vars.FE_APP_DIR }}
        env:
          # ditampilkan di aplikasi sebagai kode build (mis. "Versi 1.0.0 (abc1234)")
          GITHUB_SHA: ${{ github.sha }}
        run: docker compose up -d --build --remove-orphans

      - name: Cek container berjalan
        working-directory: ${{ vars.FE_APP_DIR }}
        run: |
          sleep 3
          docker compose ps
          if [ "$(docker inspect -f '{{.State.Running}}' mysmk-web)" != "true" ]; then
            docker compose logs --tail=100 web
            echo "::error::Container mysmk-web tidak berjalan"
            exit 1
          fi

      - name: Bersihkan image lama
        run: docker image prune -f
